name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install ruff
      - run: .venv/bin/ruff format --check src tests && .venv/bin/ruff check src tests

  pure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        torch: ["2.5.1", "2.7.1", "2.9.1"]
        exclude:
          - python: "3.12"
            torch: "2.5.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

  # everything, on a machine with a GPU. Self hosted runner, started by hand until there is one.
  gpu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cu128 && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q -m gpu
