[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vramxray"
version = "0.1.0"
description = "See the GPU memory PyTorch can't show you: explains CUDA OOMs, fragmentation, and where the rest of your VRAM went."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
native = ["ninja"]              # the C++ core builds on first use; needs a compiler and CUDA headers
polars = ["polars>=1.0"]
dev = ["pytest>=8", "pytest-cov", "ruff", "ninja", "polars>=1.0"]

[project.urls]
Repository = "https://github.com/DhruvaD1/vram_xray"

[project.scripts]
vramxray = "vramxray.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vramxray"]

[tool.hatch.build.targets.sdist]
include = ["src/vramxray", "tests", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
